<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Event Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <h1>Event Booking</h1>
    <h3>User Management Login</h3>

    <label>Email</label>
    <input
        type="email"
        id="email"
        placeholder="Enter email"
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button
        class="login-btn"
        onclick="login()"
    >
        Login
    </button>

    <p id="message" class="error"></p>

</div>


<script>

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.innerText = "";


    if (email === "" || password === "") {

        message.innerText =
            "Please enter email and password.";

        return;
    }


    try {

        const response = await fetch(
            "../backend/login.php",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            // Save JWT
            localStorage.setItem(
                "token",
                data.token
            );

            // Save user information
            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            // Only Administrator can access
            // User Management frontend
            if (data.user.role === "Administrator") {

                window.location.href =
                    "users.html";

            } else {

                localStorage.clear();

                message.innerText =
                    "Access denied. Administrator only.";
            }

        } else {

            message.innerText =
                data.message;
        }


    } catch (error) {

        message.innerText =
            "Unable to connect to server.";
    }
}

</script>

</body>
</html>
