
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venue Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="padding:16px;background:#222;color:white;display:flex;justify-content:space-between">
        <strong>Event Booking System | Venue Management</strong>
        <button onclick="logout()">Logout</button>
    </header>

    <main style="max-width:750px;margin:25px auto;padding:15px">
        <section style="background:white;padding:20px;margin-bottom:15px">
            <h3 id="welcome">Welcome</h3>
            <p id="role"></p>
        </section>

        <section style="background:white;padding:20px;margin-bottom:15px">
            <h3 id="formTitle">Add New Venue</h3>

            <form id="venueForm">
                <label>Venue Name</label>
                <input id="venueName" required>

                <label>Location</label>
                <input id="location" required>

                <label>Capacity</label>
                <input id="capacity" type="number" min="1" required>

                <label>Status</label>
                <select id="status">
                    <option value="Available">Available</option>
                    <option value="In Use">In Use</option>
                    <option value="Unavailable">Unavailable</option>
                </select>

                <p>
                    <button type="submit" id="saveBtn">Add Venue</button>
                    <button type="button" onclick="resetForm()">Cancel / Clear</button>
                </p>
            </form>
            <p id="message"></p>
        </section>

        <section style="background:white;padding:20px">
            <h3>Venue List</h3>
            <button onclick="loadVenues()">Refresh Venues</button>
            <div style="overflow-x:auto">
                <table border="1" cellpadding="8" style="width:100%;border-collapse:collapse;margin-top:12px">
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Location</th>
                            <th>Capacity</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="venueRows"></tbody>
                </table>
            </div>
        </section>
    </main>

<script>
const API = "../backend/venues.php";
const token = localStorage.getItem("token");
let user = null;
let editingId = null;
let venues = [];

try {
    user = JSON.parse(localStorage.getItem("user") || "null");
} catch (e) {
    user = null;
}

if (!token || !user || user.role !== "Administrator") {
    window.location.replace("login.html");
} else {
    document.getElementById("welcome").textContent =
        "Welcome, " + user.name;
    document.getElementById("role").textContent =
        "Role: " + user.role;
    loadVenues();
}

function showMessage(text, error = false) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.style.color = error ? "red" : "green";
}

async function request(method, url, body = null) {
    const options = {
        method,
        headers: {
            "Authorization": "Bearer " + token
        }
    };

    if (body !== null) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
    }

    const response = await fetch(url, options);
    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || "Request failed");
    }

    return data;
}

async function loadVenues() {
    try {
        const result = await request("GET", API);
        venues = result.data || [];

        const tbody = document.getElementById("venueRows");
        tbody.replaceChildren();

        venues.forEach(venue => {
            const tr = document.createElement("tr");

            [
                venue.venue_id,
                venue.venue_name,
                venue.location,
                venue.capacity,
                venue.status
            ].forEach(value => {
                const td = document.createElement("td");
                td.textContent = value ?? "";
                tr.appendChild(td);
            });

            const action = document.createElement("td");

            const edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.onclick = () => editVenue(venue.venue_id);

            const del = document.createElement("button");
            del.textContent = "Delete";
            del.onclick = () => deleteVenue(venue.venue_id);

            action.append(edit, " ", del);
            tr.appendChild(action);
            tbody.appendChild(tr);
        });
    } catch (error) {
        showMessage(error.message, true);
    }
}

document.getElementById("venueForm").addEventListener("submit", async event => {
    event.preventDefault();

    const body = {
        venue_name: document.getElementById("venueName").value.trim(),
        location: document.getElementById("location").value.trim(),
        capacity: Number(document.getElementById("capacity").value),
        status: document.getElementById("status").value
    };

    try {
        if (editingId === null) {
            await request("POST", API, body);
            showMessage("Venue created successfully.");
        } else {
            await request("PUT", API + "?id=" + editingId, body);
            showMessage("Venue updated successfully.");
        }

        resetForm();
        await loadVenues();
    } catch (error) {
        showMessage(error.message, true);
    }
});

function editVenue(id) {
    const venue = venues.find(v => Number(v.venue_id) === Number(id));
    if (!venue) return;

    editingId = id;
    document.getElementById("venueName").value = venue.venue_name;
    document.getElementById("location").value = venue.location;
    document.getElementById("capacity").value = venue.capacity;
    document.getElementById("status").value = venue.status;
    document.getElementById("formTitle").textContent = "Edit Venue #" + id;
    document.getElementById("saveBtn").textContent = "Update Venue";
    window.scrollTo(0, 0);
}

async function deleteVenue(id) {
    if (!confirm("Delete Venue #" + id + "?")) return;

    try {
        await request("DELETE", API + "?id=" + id);
        showMessage("Venue deleted successfully.");
        resetForm();
        await loadVenues();
    } catch (error) {
        showMessage(error.message, true);
    }
}

function resetForm() {
    editingId = null;
    document.getElementById("venueForm").reset();
    document.getElementById("formTitle").textContent = "Add New Venue";
    document.getElementById("saveBtn").textContent = "Add Venue";
}

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}
</script>
</body>
</html>
